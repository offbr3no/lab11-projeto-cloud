name: Deploy One-Page com Docker na EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Copiar arquivos para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/app"

      - name: Construir e rodar container Docker na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            # Encontra a pasta onde está o Dockerfile caso tenha sido enviado em subpasta
            DIR=$(dirname $(find . -name "Dockerfile*" | head -n 1))
            cd "$DIR"
            # Garante que o arquivo se chame exatamente Dockerfile (sem .txt)
            [ -f Dockerfile.txt ] && mv Dockerfile.txt Dockerfile
            docker stop onepage-container || true
            docker rm onepage-container || true
            docker build -t onepage-img .
            docker run -d --name onepage-container -p 80:80 onepage-img
